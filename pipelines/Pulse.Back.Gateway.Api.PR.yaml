trigger: none

pool:
  vmImage: 'ubuntu-latest'

resources:
  repositories:
  - repository: Pulse
    name: 'Pulse.Operations.Pipelines'
    type: git
    ref: 'refs/heads/Release/v5.0'
  - repository: PulseReview   # alias impose (reference par le template Build-Back)
    name: 'Pulse.Operations.Review'
    type: git
    ref: 'refs/heads/main'

extends:
  template: pipelines/pull-request/back.yaml@Pulse
  parameters:
    name: desktop
    srcPath: src/ApiGateway/ApiGateway.csproj
    testsPath: tests/**/*Tests.csproj
    sonarExclusions: '**/Program.cs, **/Extensions/**,tests/**'
    enableAiReview: true
