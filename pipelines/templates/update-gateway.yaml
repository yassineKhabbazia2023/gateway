#             steps:
#             - download: current
#               artifact: Module
#             - template: update-config.yaml
#               parameters:
#                 environment: dev01
#                 subscription: ceg-corp-pulse-dev
#                 serviceConnection: Rydge-dev

- ${{ if parameters.deployToItg }}:
  - stage: ITG01
    displayName: 'Integration'
    pool: Pulse-Linux-itg
    dependsOn: Build
    jobs:
    - deployment: deploy
      displayName: 'Updating config'
      environment: ITG01
      strategy:
        runOnce:
          deploy:
            steps:
            - download: current
              artifact: Module
            - template: update-config.yaml
              parameters:
                environment: itg01
                subscription: ceg-corp-pulse-itg
                serviceConnection: Rydge-itg
                squad: ${{ parameters.squad }}

- ${{ if or(eq(variables['Build.SourceBranch'], 'refs/heads/main'), startsWith(variables['Build.SourceBranch'], 'refs/tags/'), eq(parameters.isHotfix, true)) }}:
  - ${{ if parameters.deployToRec }}:
    - stage: REC01
      displayName: Recette-rec01
      pool: Pulse-Linux-rec
      dependsOn: Build
      jobs:
      - deployment: deploy
        displayName: 'Updating REC01 config'
        environment: REC01
        strategy:
          runOnce:
            deploy:
              steps:
              - download: current
                artifact: Module

              - template: update-config.yaml
                parameters:
                  environment: rec01
                  subscription: ceg-corp-pulse-rec
                  serviceConnection: Rydge-rec
  # - stage: PPR01
  #   displayName: Preproduction-J-1
  #   pool: Pulse-ppr
  #   dependsOn:
  #   - REC01
  #   jobs:
  #   - deployment: deploy
  #     displayName: 'Updating J-1 config'
  #     environment: PPR01
  #     variables:
  #     - name: hubEnvironment
  #       value: ppr01
  #     strategy:
  #       runOnce:
  #         deploy:
  #           steps:
  #           - download: current
  #             artifact: Module

  #           - template: update-config.yaml
  #             parameters:
  #               environment: $(hubEnvironment)
  #               subscription: ceg-corp-pulse-ppr
  #               serviceConnection: Rydge-ppr
  - ${{ if parameters.deployToPrd }}:
    - stage: PRD01
      displayName: Production-prd01
      pool: Pulse-Linux-prd
      dependsOn:
      - ${{ if parameters.isHotfix }}:
        - Build
      - ${{ else }}:
        - REC01
      jobs:
      - deployment: deploy
        displayName: 'Updating PRD01 config'
        environment: PRD01
        strategy:
          runOnce:
            deploy:
              steps:
              - download: current
                artifact: Module

              - template: update-config.yaml
                parameters:
                  environment: prd01
                  subscription: ceg-corp-pulse-prd
                  serviceConnection: Rydge-prd
