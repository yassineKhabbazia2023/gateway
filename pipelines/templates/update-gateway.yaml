parameters:
- name: deployToDev
  displayName: 'Déployer sur DEV'
  type: boolean
  default: false
- name: deployToItg
  displayName: 'Déployer sur ITG'
  type: boolean
  default: true
- name: deployToRec
  displayName: 'Déployer sur REC'
  type: boolean
  default: true
- name: deployToPrd
  displayName: 'Déployer sur PROD'
  type: boolean
  default: true
- name: isHotfix
  type: boolean
  default: false
- name: squad
  type: string
  default: none
  values:
    - none
    - transverse
    - tokyo
    - frydge
    - forrest
    - joker

stages:
- ${{ if eq(parameters.deployToDev, true) }}:
  - 'Deployment to DEV environment is no longer supported.': error

- ${{ if and(parameters.deployToPrd, not(parameters.deployToRec), not(parameters.isHotfix)) }}:
  - 'Deploying to REC is mandatory before deploying to PROD.': error

- ${{ if and(not(parameters.deployToItg), not(parameters.deployToRec), not(parameters.deployToPrd)) }}:
  - 'At least one environment must be chosen.': error

- ${{ if and(parameters.isHotfix, not(startsWith(variables['Build.SourceBranch'], 'refs/heads/hotfix/'))) }}:
  - 'Hotfix pipeline must be run from a hotfix/* branch.': error

- ${{ if and(parameters.deployToRec, ne(parameters.squad, 'none')) }}:
  - 'Team configuration cannot be deployed to REC.': error

- stage: build
  displayName: 'Build'
  jobs:
  - job: build
    displayName: 'Build'
    steps:
    - pwsh: Copy-Item -Path $(Build.SourcesDirectory)/src/Config/ocelot.json -Destination $(Build.SourcesDirectory)/pipelines/ocelot.json
    - publish: $(Build.SourcesDirectory)/pipelines
      artifact: Module

# - ${{ if parameters.deployToDev }}:
#   - stage: DEV
#       displayName: 'Development-dev01'
#     pool: Pulse-Linux-dev
#     jobs:
#     - deployment: deploy
#       displayName: 'Updating config'
#       environment: DEV
#       strategy:
