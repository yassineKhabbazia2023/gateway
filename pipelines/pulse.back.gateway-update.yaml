name: $(Date:yyyyMMdd)$(Rev:.r)-$(SourceBranchName)

trigger: none

pool:
  vmImage: windows-latest

parameters:
- name: devIndex
  type: number
  default: 0
- name: deployType
  displayName: "Technical parameter : don t modify it !"
  type: string
  default: 'standard'

resources:
  repositories:
  - repository: Pulse
    name: 'Constellation/ConstellationDevOps'
    type: git
    ref: 'refs/heads/features/change-naming'

stages:
- template: templates/update-gateway.yaml
  parameters:
    devIndex: ${{ parameters.devIndex }}
    deployType: ${{ parameters.deployType }}
