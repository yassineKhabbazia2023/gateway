name: $(Date:yyyyMMdd)$(Rev:.r)-$(SourceBranchName)

trigger:
  branches:
    include:
     - main
  paths:
    include:
    - src/Config

pool:
  vmImage: windows-latest

parameters:
- name: devIndex
  type: number
  default: 0
- name: deployType
  displayName: "Technical parameter : don t modify it !"
  type: string
  default: 'standard'
  values:
    - standard
    - onlyDev

stages:
- template: templates/update-gateway.yaml
  parameters:
    devIndex: ${{ parameters.devIndex }}
    deployType: ${{ parameters.deployType }}
